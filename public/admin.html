<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uxman Gee — Review Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ed;
      color: #171717;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header span {
      color: #d4af37;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin: 10px 0;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      margin: 5px;
    }

    .login-btn,
    .approve {
      background: #d4af37;
      color: #111;
    }

    .delete {
      background: #b3261e;
      color: white;
    }

    .review {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin: 15px 0;
    }

    .review p {
      color: #555;
    }

    .status {
      font-size: 13px;
      font-weight: bold;
      color: #777;
    }

    #dashboard {
      display: none;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>UXMAN <span>GEE</span></h1>
  <p>Review Administration</p>
</header>

<main>

  <section class="card" id="loginBox">
    <h2>Admin Login</h2>

    <input
      type="password"
      id="password"
      placeholder="Enter admin password"
    >

    <button class="login-btn" onclick="login()">
      Login
    </button>

    <div id="message"></div>
  </section>

  <section class="card" id="dashboard">

    <h2>Customer Reviews</h2>

    <p>
      Approve reviews you want customers to see on the website.
    </p>

    <button class="login-btn" onclick="loadReviews()">
      Refresh Reviews
    </button>

    <div id="reviews"></div>

  </section>

</main>

<script>

let adminPassword = "";

async function login() {

  const password =
    document.getElementById("password").value.trim();

  if (!password) {
    showMessage("Please enter the admin password.");
    return;
  }

  try {

    const response = await fetch("/api/admin/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        password
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      showMessage(result.error || "Login failed.");
      return;
    }

    adminPassword = password;

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    loadReviews();

  } catch (error) {

    showMessage(
      "Unable to connect to the server."
    );

  }
}


async function loadReviews() {

  const container =
    document.getElementById("reviews");

  container.innerHTML =
    "<p>Loading reviews...</p>";

  try {

    const response =
      await fetch("/api/admin/reviews");

    const result =
      await response.json();

    if (!response.ok || !result.success) {
      container.innerHTML =
        "<p>Unable to load reviews.</p>";
      return;
    }

    const reviews =
      result.reviews || [];

    if (reviews.length === 0) {
      container.innerHTML =
        "<p>No customer reviews yet.</p>";
      return;
    }

    container.innerHTML = "";

    reviews.forEach(review => {

      const div =
        document.createElement("div");

      div.className = "review";

      const name =
        document.createElement("h3");

      name.textContent =
        review.name;

      const text =
        document.createElement("p");

      text.textContent =
        review.review;

      const status =
        document.createElement("div");

      status.className =
        "status";

      status.textContent =
        "Status: " + review.status;

      div.appendChild(name);
      div.appendChild(text);
      div.appendChild(status);

      if (review.status !== "approved") {

        const approve =
          document.createElement("button");

        approve.className =
          "approve";

        approve.textContent =
          "Approve";

        approve.onclick =
          () => updateReview(
            review.id,
            "approve"
          );

        div.appendChild(approve);
      }

      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete";

      deleteButton.textContent =
        "Delete";

      deleteButton.onclick =
        () => updateReview(
          review.id,
          "delete"
        );

      div.appendChild(deleteButton);

      container.appendChild(div);

    });

  } catch (error) {

    container.innerHTML =
      "<p>Unable to connect to the server.</p>";

  }
}


async function updateReview(id, action) {

  try {

    const response =
      await fetch("/api/admin/reviews", {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          id,
          action
        })
      });

    const result =
      await response.json();

    if (!response.ok || !result.success) {

      alert(
        result.error ||
        "Unable to update review."
      );

      return;
    }

    loadReviews();

  } catch (error) {

    alert(
      "Unable to connect to the server."
    );

  }
}


function showMessage(message) {

  document.getElementById(
    "message"
  ).textContent = message;

}

</script>

</body>
</html>
